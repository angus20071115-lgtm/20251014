<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f5f9" />
    <title>高中數學選擇題測驗</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chocolate+Classical+Sans&family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- 可執行的 p5.js CDN；sketch.js 必須在 p5.js 之後載入。 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.10/p5.min.js"></script>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f1f5f9; }
      body { font-family: "Chocolate Classical Sans", sans-serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
      #canvas-root { position: fixed; inset: 0; z-index: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #diagnostic-panel {
        position: fixed; z-index: 5; left: 50%; top: 50%; transform: translate(-50%, -43%);
        width: min(820px, calc(100vw - 32px)); max-height: min(68vh, 570px); overflow: auto;
        padding: 22px 24px; border: 1px solid #fecaca; border-radius: 16px;
        background: rgba(255, 255, 255, 0.97); color: #334155;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.15); text-align: left;
      }
      #diagnostic-panel[hidden] { display: none; }
      #diagnostic-panel h2 { margin: 0 0 12px; color: #b91c1c; font-size: clamp(20px, 3vw, 30px); text-align: center; }
      #diagnostic-panel p { margin: 8px 0; line-height: 1.55; }
      #diagnostic-panel code, #diagnostic-url, #diagnostic-status { font-family: "Roboto Mono", monospace; font-size: 12px; overflow-wrap: anywhere; }
      #diagnostic-url, #diagnostic-status { display: block; margin-top: 4px; padding: 9px 10px; border-radius: 8px; background: #f8fafc; }
      #diagnostic-causes, #diagnostic-steps { margin: 8px 0 0; padding-left: 24px; line-height: 1.6; }
      #diagnostic-causes li, #diagnostic-steps li { margin: 4px 0; }
      #action-button {
        position: fixed; z-index: 10; display: inline-flex; align-items: center; justify-content: center;
        min-width: 184px; min-height: 44px; padding: 10px 18px; border: 0; border-radius: 10px;
        background: #2563eb; color: #fff; font-family: "Roboto Mono", monospace; font-size: 16px; font-weight: 600;
        line-height: 1.2; cursor: pointer; pointer-events: auto; box-shadow: 0 4px 12px rgba(37, 99, 235, .25);
        transition: background-color .15s ease, transform .15s ease;
      }
      #action-button:hover { background: #1d4ed8; }
      #action-button:active { transform: translateY(1px); }
      #action-button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
      #action-button[hidden] { display: none; }
      @media (max-width: 600px) {
        #diagnostic-panel { padding: 16px 15px; max-height: 70vh; }
        #diagnostic-panel p, #diagnostic-causes, #diagnostic-steps { font-size: 14px; }
      }
    </style>
  </head>
  <body>
    <div id="canvas-root" aria-hidden="true"></div>
    <section id="diagnostic-panel" hidden aria-live="polite">
      <h2>題庫載入失敗</h2>
      <p><strong>實際請求網址</strong><code id="diagnostic-url"></code></p>
      <p><strong>HTTP / 網路狀態</strong><code id="diagnostic-status"></code></p>
      <p><strong>可能原因</strong></p>
      <ul id="diagnostic-causes"></ul>
      <p><strong>操作步驟</strong></p>
      <ol id="diagnostic-steps"></ol>
    </section>
    <button id="action-button" type="button" hidden></button>
    <script src="./sketch.js"></script>
  </body>
</html>
